name: Gitleaks

on:
  push:
    branches:
      - version-16
      - develop
  pull_request:
    branches:
      - version-16
      - develop

permissions:
  contents: read
  pull-requests: write # gitleaks-action comments on the PR when it finds something

jobs:
  # Repository secrets are available here: pushes, and pull requests from
  # branches in this repository that were not opened by Dependabot. Keep the
  # licensed action for these so we retain PR comments and Dependabot-managed
  # version bumps.
  gitleaks-action:
    name: Gitleaks
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # No repository secrets here: pull requests from forks, and pull requests
  # opened by Dependabot. gitleaks-action hard-fails on organisation repos
  # without GITLEAKS_LICENSE, so run the MIT-licensed CLI instead and actually
  # scan these contributions rather than failing them on the missing key.
  gitleaks-cli:
    name: Gitleaks
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
      # release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Update both
      # together when bumping the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xz -C /usr/local/bin -f "$archive" gitleaks
          rm -f "$archive"
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .

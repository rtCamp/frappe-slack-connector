name: Gitleaks

on:
  push:
    branches:
      - version-16
      - develop
  pull_request:
    branches:
      - version-16
      - develop

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
      # release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Update both
      # together when bumping the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT licensed and needs no license key, unlike
      # gitleaks-action which hard-fails on organisation repos when
      # GITLEAKS_LICENSE is unavailable. GitHub never exposes repository
      # secrets to pull requests from forks or to Dependabot, so every
      # external contribution was failing this check for the wrong reason.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xz -C /usr/local/bin -f "$archive" gitleaks
          rm -f "$archive"
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .

name: Unit Tests
permissions:
  contents: read

on:
  push:
    branches: [version-16, develop]
  pull_request:
  # The upstream branches move between our pushes: hrms dropped a re-export
  # in 16.20.0 and the release branch kept passing until the next deploy broke
  # the Slack endpoints. The weekly run tests both branches against the
  # current upstream version-16 so that shows up here first.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  # The event is part of the group so a scheduled run and a push to the same
  # branch do not cancel each other (a cancelled run is not a failure, so it
  # would also send no alert)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs cover both long-lived branches; pushes, pull requests
        # and manual runs test the ref that triggered them (an empty ref keeps
        # actions/checkout's default)
        ref: ${{ github.event_name == 'schedule' && fromJSON('["develop", "version-16"]') || fromJSON('[""]') }}

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app hrms --branch version-16
          bench get-app frappe_slack_connector $GITHUB_WORKSPACE
          bench new-site --db-root-password root --admin-password admin --no-mariadb-socket --install-app erpnext --install-app hrms test_site
          bench --site test_site install-app frappe_slack_connector
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_slack_connector

      - name: Alert on a scheduled failure
        # GitHub only emails the workflow's author; scheduled runs need a louder channel
        if: failure() && github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ matrix.ref }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_ALERT_WEBHOOK_URL is not set; only GitHub's failure email goes out"
            exit 0
          fi
          payload=$(jq -nc --arg text ":red_circle: frappe_slack_connector tests failed against upstream version-16 on \`$BRANCH\`: $RUN_URL" '{text: $text}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
